# ================================================================================
# YOLO DETECTION TRAINING CONFIGURATION
# ================================================================================

# --- Dummy paths for YOLOv8 trainer compatibility ---
# Our custom dataloader ignores these paths, but they are required to pass initial checks.
train: ./dummy_train.txt
val: ./dummy_val.txt
nc: 1
names: ['fish']

# ================================================================================
# DATASET CONFIGURATION
# ================================================================================
# Each dataset can independently specify which detection stage to use:
# - 'detect': Original detections (blob/YOLO outputs, may contain jumps)
# - 'filtered': Refined detections with jumps/outliers removed (RECOMMENDED)
# - 'interpolated': Refined with gaps filled (includes synthetic data)
# - 'manual': Manual refined detections (highest quality when available)
#
# RECOMMENDATION: Use 'filtered' as default for training on real data only.
# ================================================================================

datasets:
  # Dataset 1
  arena4:
    zarr_path: /nvme1/danio/danio-rgb4.zarr
    source_type: manual        # detect | filtered | interpolated | manual
    input_format: rgb         # gray (default) or rgb if importing color downsampled frames
    
    # Optional: Custom split ratios per dataset (defaults to global split below)
    split:
      train: 0.8
      val: 0.2
  
  # Add more datasets as needed:
  # arena4_sesh1:
  #   zarr_path: /path/to/another.zarr
  #   source_type: filtered
  #   split:
  #     train: 0.8
  #     val: 0.2

# ================================================================================
# GLOBAL DATASET SETTINGS
# ================================================================================
task: detect
random_seed: 42

# Sampling Strategy
# --------------------------------------------------------------------------------
# "balanced": Equal samples from each dataset (matches smallest dataset size)
# "proportional": Sample proportionally to dataset size (uses all data)
# "weighted": Manual control via dataset_weights below
sampling_strategy: balanced

# Fail fast when requested dataset source_type does not match available crop source.
# Set true only when intentionally allowing fallback to available source.
allow_source_mismatch: false

# Optional: Only needed for 'weighted' sampling strategy
# Uncomment and adjust weights as needed (must match dataset names above)
# dataset_weights:
#   arena4_sesh3: 1.0
#   arena4_sesh1: 2.0

# ================================================================================
# MODEL & TRAINING HYPERPARAMETERS
# ================================================================================
training_params:
  # Model setup
  model: yolo11n.pt
  
  # Core hyperparameters
  epochs: 100  # Number of training epochs
  batch: 128    # Batch size for training
  imgsz: 2304   # Input image size for training
  rect: true           # Enable rectangular training batches to reduce padding
  lr0: 0.002   # Initial learning rate
  momentum: 0.9          # Momentum factor
  weight_decay: 0.0005   # Weight decay (L2 penalty)
  patience: 10           # Early stopping patience
  device: '0'            # CUDA device
  max_det: 1             # Max detections per image (post-NMS)
  # Augmentations tuned for single-fish grayscale data
  mosaic: 0.0
  close_mosaic: 0
  auto_augment: null
  hsv_h: 0.0
  hsv_s: 0.0
  hsv_v: 0.15
  degrees: 15.0
  translate: 0.05
  scale: 0.1
  shear: 0.0
  perspective: 0.0
  fliplr: 0.5
  flipud: 0.0
  erasing: 0.0
  mixup: 0.0
  copy_paste: 0.0
  cutmix: 0.0

# ================================================================================
# TRAINING HISTORY & METADATA
# ================================================================================
# This section is automatically populated by the training script after each run.
# It includes complete data provenance tracking:
# 
# Per-dataset metadata:
# - Detection source type (detect/filtered/interpolated)
# - Source run names and timestamps
# - Real vs. interpolated detection counts (if applicable)
# - Quality metrics (coverage, jumps removed, gaps filled)
# - Refinement parameters used
# 
# Training metrics:
# - Model performance (mAP, precision, recall)
# - Training time and resource usage
# - Final model checkpoint paths
# ================================================================================
