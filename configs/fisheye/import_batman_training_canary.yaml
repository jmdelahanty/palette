import:
  resolutions: both
  use_kvikio_zarr: true
  use_sharding: false
  # Physical chunks are contract-derived as complete (1, H, W) frames.
  chunks_per_shard: 1
  batch_size: 1
  gpu_fp16: true
  full: true
  downsampled:
    preserve_aspect: true
    # Detection training consumes images_ds directly. Batman source frames are
    # square, so the canonical 640x640 default introduces no letterbox padding.
    size: [640, 640]
    method: area
    formats: [gray]
