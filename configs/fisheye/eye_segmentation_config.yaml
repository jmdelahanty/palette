# ================================================================================
# Eye Mask Segmentation Training Configuration
# ================================================================================
# This file configures YOLO segmentation training using ROI crops and masks
# stored directly inside Palette Zarr archives.
#
# Usage:
#   python -m fisheye.training.train_eye_masks configs/fisheye/eye_segmentation_config.yaml
#
# Replace the example dataset path below with your own Zarr archive (or add
# additional datasets under `datasets:`). All paths may be absolute or relative.
# ================================================================================

# --- Minimal placeholders required by Ultralytics ---
# These are ignored by our custom dataloader but must exist for validation.
train: ./dummy_train.txt
val: ./dummy_val.txt
nc: 1
names: ['eye']

# ================================================================================
# DATASETS
# ================================================================================
# Each entry corresponds to a Palette Zarr file. Training pulls ROI crops from
# the specified crop run and uses the matching eye-mask run for labels.
# ------------------------------------------------------------------------------
# Options per dataset:
#   zarr_path                 Path to the Zarr archive.
#   crop_run                  (Optional) Specific crop run. Defaults to latest.
#   mask_run                  (Optional) Specific eye mask run. Defaults to latest.
#   split                     Train/val split override (defaults to global split).
#   min_positive_area         Minimum pixel area for an eye mask to count as positive.
#   require_both_eyes         If true, only ROIs where both eyes exceed min area are kept.
#   include_empty             If false, ROIs without valid masks are dropped.
#   include_background_negatives
#                             When true, sample negatives from the background run.
#   background_negative_ratio Ratio of background negatives per positive ROI.
#   background_run            (Optional) Background run name. Defaults to latest.
#   background_from_downsampled
#                             Use downsampled background instead of full-res.
# ================================================================================

datasets:
  arena4_example:
    zarr_path: /nvme1/sesh3/2025-09-23T22-11-11Z_arena_4_chaser_arena4.zarr
    crop_run: null                     # Use latest crop run
    mask_run: null                     # Use latest eye mask run (traditional or YOLO)
    split:
      train: 0.8
      val: 0.2
    require_both_eyes: true            # Only keep ROIs where both eyes are present
    include_empty: false               # Drop ROIs with missing/failed masks
    include_background_negatives: true # Add background crops as true negatives
    background_negative_ratio: 0.4
    background_run: null               # Use latest computed background
    background_from_downsampled: false # Use full-resolution background

# ================================================================================
# GLOBAL SETTINGS
# ================================================================================
random_seed: 42
target_size: 256               # ROI resize dimension for training
mask_smoothing_kernel: 3       # Optional morphological smoothing (odd size, set 0 to disable)
edge_enhancement: null         # Optional edge channel ('sobel', 'laplacian', 'canny', or null)
binarization_threshold: null   # Optional fixed threshold (0-255) for an extra binary channel
default_split:
  train: 0.8
  val: 0.2
num_workers: 8                 # DataLoader workers per process
cache:
  enabled: true               # Materialize ROI crops/masks to disk for faster training
  directory: runs/cache/eye_masks
  reuse_existing: true
  workers: 24
  backend: process

# ================================================================================
# TRAINING PARAMETERS
# ================================================================================
# Adjust these to match your compute budget and backbone choice.
# `model` can be any Ultralytics segmentation checkpoint (e.g. yolov8n-seg.pt).
# ================================================================================
training_params:
  model: yolo11n-seg.pt
  epochs: 100
  batch: 128
  imgsz: 256
  lr0: 0.0005
  momentum: 0.9
  weight_decay: 0.0005
  patience: 20
  device: '0'                # CUDA device id or 'cpu'
  project: runs/eye_masks     # Directory under runs/ for training outputs
  conf: 0.8                   # Confidence threshold for validation detections
  seg_loss: bce_dice              # Optional custom mask loss ('bce_dice', etc.)
  bce_weight: 0.5                 # Optional BCE weight when using BCE+Dice (0-1)

  # ============================================================================
  # LOSS WEIGHTS
  # ============================================================================
  # Increase seg weight to prioritize mask boundary precision
  # Default YOLOv8 weights: box=7.5, cls=0.5, dfl=1.5, seg=5.0
  # ============================================================================
  box: 5.0                   # Bounding box loss weight (default)
  cls: 0.5                   # Classification loss weight (default)
  dfl: 1.5                   # Distribution focal loss weight (default)
  seg: 12.0                  # Segmentation loss weight (INCREASED from 5.0)

  # Max detections per image (set to expected number of fish in arena)
  max_det: 2
  mosaic: 0.0
  copy_paste: 0.0
  degrees: 5.0
  scale: 0.1
  translate: 0.05
  shear: 0.0
  perspective: 0.0
