import:
  # Resolution configuration - what to generate during import
  resolutions: both              # Options: 'full', 'downsampled', 'both'
  
  # Chunk and shard configuration (applies to all resolutions)
  chunk_size: 128               # Frames per chunk (smallest storage unit)
  use_sharding: false           # Enable Zarr v3 sharding (groups chunks into shards)
  chunks_per_shard: 1           # Number of chunks per shard (only if use_sharding=true)

  # Processing configuration
  batch_size: 64                # Frames decoded at once from video
  gpu_fp16: true                # Use float16 for GPU grayscale conversion
  
  # GPU Direct Storage options
  use_kvikio_zarr: true         # Enable kvikIO for GPU→Zarr direct writes
  
  # Full resolution settings (used when resolutions includes 'full')
  full:
    # Inherits chunk_size from parent by default
    # No compression - GDS writes raw data directly
    
  # Downsampled settings (used when resolutions includes 'downsampled')  
  downsampled:
    size: [640, 640]           # Target [height, width] for downsampled frames
    method: area               # Options: 'nearest', 'bilinear', 'bicubic', 'area', 'lanczos'
    chunk_size: 128            # Can differ from full resolution chunks
    preserve_aspect: false     # If true, pad instead of stretch
    # No compression - GDS writes raw data directly
    
  # Optional post-processing compression (separate stage after import)
  post_compress:
    enable: false              # Run compression as separate stage after import
    targets: ['downsampled']   # Which arrays to compress: ['full', 'downsampled', 'both']
    method: lz4                # Compression method for post-processing
    level: 1                   # Compression level
    delete_uncompressed: false # Whether to remove uncompressed version
    
  # Misc settings
  include_system_info: true