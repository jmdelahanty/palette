import:
  # existing
  downsample_size: [640, 640]
  chunk_size: 32
  shard_size: 64
  shard_size_ds: 128
  batch_size: 64
  compression: none        # 'none' | 'lz4' | 'zstd' | 'blosc'
  compression_level: 1
  max_writers: 10
  max_inflight: 16

  # new (GDS-capable path)
  gpu_fp16: true           # already supported by the code; keep true for speed

  # --- GDS controls ---
  import_gds_enable: true  # turn on GDS shard writes when on CUDA
  gds_dir: "/nvme1/fish_runs/run_001"   # NVMe ext4/xfs directory (must exist & be writable)
  gds_require: true       # if true, error instead of falling back to CPU/Zarr
