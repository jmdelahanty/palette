import:
  resolutions: both
  chunk_size: 16
  use_sharding: true
  chunks_per_shard: 2
  batch_size: 32
  gpu_fp16: true
  use_kvikio_zarr: true
  full: true
  downsampled:
    size:
    - 640
    - 640
    method: bilinear
    formats: [gray]
    chunk_size: 16
    preserve_aspect: false
  post_compress:
    enable: false
    targets:
    - downsampled
    method: lz4
    level: 1
    delete_uncompressed: false
  include_system_info: true
background:
  sample_size: 500
  seed: 195
  method: mode
  compute_full: true
  compute_ds: true
detect:
  ds_thresh: 13
  se1_radius: 2
  se4_radius: 10
  min_area: 85
  max_area: 2000
  max_fish: 1
  dish_mask:
    shape: circle
    center:
    - 328
    - 310
    radius: 295
    hough_params:
      param1: 50
      param2: 30
      radius_adjustment: 4
    source:
      array: images_ds
      frame: 22724
      timestamp: '2025-09-30T23:21:53.102671'
crop:
  roi_sz:
  - 512
  - 512
  scheduler: distributed
  source_type: auto                # detect | filtered | interpolated | manual | refined | auto
  num_workers: 5
  # External-video crop write path (analysis zarrs without imported raw frames)
  external_write_backend: kvikio
  external_roi_storage: uncompressed
  external_use_sharding: false
  external_roi_chunk_size: 128
  external_roi_shard_size: 2048
  external_gpu_chunk_frames: 8
  external_require_kvikio: true
keypoints:
  method: traditional         # 'traditional' or 'yolo'
  scheduler: distributed  # or 'processes', 'threads'
  num_workers: 5
  threads_per_worker: 2
  memory_limit: '50GB'
  roi_thresh: 50
  se1_radius: 1
  se2_radius: 2
  min_area: 5
  min_valid_angle: 10.0
  max_valid_angle: 90.0
  min_triangle_area: 100.0
  max_triangle_area: null
refine_detect:
  filters:
    remove_jumps: true
    remove_blips: false  # Usually keep blips, they're just after gaps
  # Interpolation settings are deprecated. Sparse-first refine_detect writes
  # curated instances without gap interpolation.
refine_eye_masks:
  enabled: true
  source_run: null
  run_name: null
  keypoint_run: null
  chunk_size: 512
  scheduler: processes
  num_workers: null
  area_filter_z: 2.0
  area_filter_mode: either
  force_refine_traditional: false
  allow_latest_keypoint_fallback: false
refine_subject_masks:
  enabled: false              # Explicit --stages refined_subject_masks overrides this gate
  subject_run: null
  source_run: null            # Alias for subject_run
  refined_run: null
  run_name: null              # Alias for refined_run
  components: null
  roi_indices: null
  chunk_size: 512
  scheduler: processes        # Set null to inherit pipeline --scheduler; supports single-threaded
  num_workers: null           # Null inherits pipeline --num-workers
