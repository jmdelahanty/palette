import:
  resolutions: both
  chunk_size: 32
  use_sharding: false
  chunks_per_shard: 1
  batch_size: 32
  gpu_fp16: true
  use_kvikio_zarr: true
  full: null
  downsampled:
    size:
    - 640
    - 640
    method: bilinear
    chunk_size: 128
    preserve_aspect: false
  post_compress:
    enable: false
    targets:
    - downsampled
    method: lz4
    level: 1
    delete_uncompressed: false
  include_system_info: true
background:
  sample_size: 500
  seed: 195
  method: mode
  compute_full: true
  compute_ds: true
detect:
  ds_thresh: 21
  se1_radius: 2
  se4_radius: 10
  min_area: 85
  max_area: 500
  max_fish: 1
  dish_mask: &id001
    shape: circle
    center:
    - 324
    - 328
    radius: 291
    hough_params:
      param1: 50
      param2: 30
      radius_adjustment: 3
    source:
      array: images_ds
      frame: 900
      timestamp: '2025-09-29T17:38:13.138667'
crop:
  dish_mask: *id001
  roi_sz: [256, 256]
  scheduler: "distributed" # "threads", "processes", or "distributed"
  num_workers: 10 # null for os.cpu_count(), for dask distributed specifically here
keypoints:
  roi_thresh: 50
  se1_radius: 1
  se2_radius: 2
  min_area: 5
  adaptive_steps: 5
  thresh_decrement: 5
