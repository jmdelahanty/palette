name: Palette Explorers
description: Explore immutable Palette analytics exports or one recording Zarr in read-only viewers and a sandboxed editable workspace.
requirements:
  - pixi>=0.40

runnables:
  - id: app
    name: Group Analytics Explorer
    type: service
    description: >-
      Select and explore a Palette analytics export. The source export remains
      read-only and the application does not provide server-side save actions.
    command: pixi run app --
    working_dir: repo
    pre_run: 'export PATH="$HOME/.pixi/bin:$PATH"'
    auto_url: true
    service_url_suffix: "/?access_token=${FG_SERVICE_TOKEN}"
    parameters:
      - flag: --export-root
        name: Analytics Export Root
        type: directory
        description: >-
          Directory containing immutable Palette analytics export manifests and
          Parquet tables. The application confines discovery and reads to this root.
        required: true
        exists: true
    resources:
      cpus: 2
      memory: "16 GB"
      walltime: "08:00"

  - id: recording-app
    name: Recording Explorer
    type: service
    description: >-
      Open one Palette analysis Zarr through bounded, capability-routed views.
      The selected Zarr is opened read-only and no save actions are exposed.
    command: pixi run -e recording recording-app --
    working_dir: repo
    pre_run: 'export PATH="$HOME/.pixi/bin:$PATH"'
    auto_url: true
    service_url_suffix: "/?access_token=${FG_SERVICE_TOKEN}"
    parameters:
      - flag: --zarr-path
        name: Recording Analysis Zarr
        type: directory
        description: >-
          One Palette analysis Zarr directory. Direct FileGlancer launches show
          only this recording unless collection arguments are supplied separately.
        required: true
        exists: true
    resources:
      cpus: 2
      memory: "16 GB"
      walltime: "08:00"

  - id: recording-workspace
    name: Recording Exploration Workspace
    type: service
    description: >-
      Open one Palette analysis Zarr in an editable Marimo notebook with the
      rendered explorer above a live analysis cell. Palette code and the
      selected recording are isolated in a Bubblewrap mount namespace and are
      read-only; only the per-session notebook workspace is writable. Marimo
      Pair may connect to the authenticated editor session.
    command: pixi run -e recording recording-workspace --
    working_dir: repo
    pre_run: 'export PATH="$HOME/.pixi/bin:$PATH"'
    auto_url: true
    service_url_suffix: "/?access_token=${FG_SERVICE_TOKEN}"
    parameters:
      - flag: --zarr-path
        name: Recording Analysis Zarr
        type: directory
        description: >-
          Exactly one Palette analysis Zarr. It is exposed inside the editable
          workspace as the read-only /data/recording.zarr mount.
        required: true
        exists: true
    resources:
      cpus: 2
      memory: "16 GB"
      walltime: "08:00"
