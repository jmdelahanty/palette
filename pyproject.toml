[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palette"
version = "0.1.0"
description = "Conversion, metadata, and analysis workflows for Palette fish behavior recordings."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Jeremy Delahanty" },
]
dependencies = [
  # Curated from environment.yml. Keep load-bearing pins aligned there.
  "numpy>=2,<2.3",
  "scipy",
  "scikit-image",
  "scikit-learn",
  "pyarrow",
  "polars",
  "pandas",
  "h5py",
  "zarr>=3,<4",
  "dask[distributed]",
  "matplotlib",
  "pillow",
  "imageio",
  "imageio-ffmpeg",
  "PyYAML",
  "rich",
  "tqdm",
  "click",
  "Flask>=3,<4",
  "pydantic",
  "hsluv",
  "networkx",
  "bokeh",
  "joblib",
  "opencv-python-headless",
  "pybaselines",
  "textual",
  "textual-plotext",
  "plotext",
  "zstandard",
]

[project.optional-dependencies]
gpu = [
  # PyTorch/model-stack dependencies used by detection, keypoint, training, and
  # segmentation modules. CUDA runtime selection remains environment-specific;
  # environment.yml is the authoritative conda workflow for GPU workstations.
  "torch>=2.5,<2.6",
  "torchvision>=0.20,<0.21",
  "torchaudio>=2.5,<2.6",
  "ultralytics==8.3.169",
  "onnx",
  "onnxruntime",
  "onnxsim",
]
dev = [
  "import-linter>=2,<3",
  "pytest>=8.4,<9",
  "plotly",
]

[project.scripts]
palette = "fisheye.cli.palette:main"
palette-backfill-subject-body-mask-qc = "fisheye.refinement.subject_body_mask_qc:main"
palette-write-refined-subject-mask-edit = "fisheye.utils.write_refined_subject_mask_edit:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fisheye = ["**/*.json", "**/*.yaml", "**/*.yml", "**/*.html", "**/*.css", "**/*.js"]

[tool.importlinter]
root_package = "fisheye"
exclude_type_checking_imports = true

[[tool.importlinter.contracts]]
id = "shared-layer"
name = "Shared layer must not import higher application layers"
type = "layers"
containers = ["fisheye"]
layers = [
  "(analysis) : (apps) : capture : cli : core : detection : diagnostics : (docs) : (group_analytics) : group_analytics_viewer : group_statistics : inference : labeling : (pose) : preprocessing : refinement : registry : segmentation : status_page : tracking : training : tune : utils : visualization",
  "shared",
]
ignore_imports = [
  # RATCHET: existing clipped-collection cache helper still reaches a legacy utils resolver.
  "fisheye.shared.clipped_collection_flat_roi_cache -> fisheye.utils.resolve_clipped_refined_detect_collection",
  # RATCHET: GPU image source helpers call the current crop implementation until the crop backend is split lower.
  "fisheye.shared.crop_image_source -> fisheye.tracking.crop",
  # RATCHET: Recording accessor still resolves registries through RegistryPaths.
  "fisheye.shared.recording -> fisheye.registry.db",
  # RATCHET: compatibility bridge while stage-completion readers migrate to the shared home.
  "fisheye.shared.registry_stage_complete -> fisheye.registry.stage_complete",
  # RATCHET: training export helpers still register datasets through the registry API.
  "fisheye.shared.training_zarr_helpers -> fisheye.registry.db",
  # RATCHET: discovery helper still uses Registry when explicit registry paths are supplied.
  "fisheye.shared.zarr_discovery -> fisheye.registry.db",
  # RATCHET: subject-mask registry status helper still bridges to registry finalization status.
  "fisheye.shared.subject_mask_registry_status -> fisheye.registry.stage_complete",
]
unmatched_ignore_imports_alerting = "error"

[[tool.importlinter.contracts]]
id = "phase2-utils-shims"
name = "Phase 2 moved utils shims must not be imported"
type = "forbidden"
source_modules = ["fisheye.**"]
forbidden_modules = [
  "fisheye.utils.calibration",
  "fisheye.utils.encoder_tags",
  "fisheye.utils.import_video_metadata",
  "fisheye.utils.recording_preflight",
  "fisheye.utils.resolve_detect_model",
  "fisheye.utils.resolve_subject_mask_model",
  "fisheye.utils.system",
  "fisheye.utils.zarr_io",
  "fisheye.utils.zarr_metadata",
]
as_packages = false
unmatched_ignore_imports_alerting = "error"
