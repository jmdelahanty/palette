          semantic_version: 6
          render_rate_hz: 240
    preconditions:
      - "Projector on before boot or any display-manager restart; projector state read over RS-232 matches the recorded settings (Brightness 50)."
      - "A fresh daily registration is run and selected in Citrus (status daily_registration_mode = selected_daily_registration), not base_only."
      - "Commissioning release current for the installed rig config."
      - "Citrus runs with subject acceptance 4, so declare_subjects takes the plan's declarations."
      - "No larva is loaded."
      - "Nothing heavy runs on the host during the session (builds, decodes, hashing)."

abort_rules:
  - { id: A1, when: "An installed build, rig config revision or render rate differs from requires.", scope: batch, action: refuse_start, status: proposed }
  - { id: A2, when: "No sign-off covers the session, or the run record's plan_sha256 does not match the plan.", scope: session, action: refuse_start, status: proposed }
  - { id: A3, when: "Citrus computes a protocol_semantic_hash different from the plan's.", scope: session, action: refuse_start, status: proposed }
  - { id: A5, when: "Citrus or Orange refuses START for any reason.", scope: session, action: skip_session, status: proposed }
  - { id: A6, when: "Any H5 of the session seals FAILED.", scope: batch, action: stop_batch, status: proposed }
  - { id: A7, when: "A precondition check fails.", scope: session, action: refuse_start, status: proposed }
  - { id: A8, when: "The Orange preset folder the session names is missing on the host or its digest differs from the plan's, or the commissioning release is missing.", scope: session, action: refuse_start, status: proposed }
  - { id: A10, when: "The plan file is not committed or has edits.", scope: batch, action: refuse_start, status: proposed }

transfer:
  mode: manual_domain_user
  destination: null
