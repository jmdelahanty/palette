name: palette-py311
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  # Portable developer / cluster environment for Palette.
  #
  # This file is intentionally not a full `conda env export` lockfile.
  # Use it to create a fresh environment on workstations or Janelia compute
  # nodes, then install the local package and optional local wheels as
  # described in docs/environment_setup.md.
  - python=3.11
  - pip

  # GPU PyTorch stack. Keep PyTorch in conda instead of pip so the CUDA wheel
  # index does not need to be configured during `conda env create`.
  - pytorch
  - torchvision
  - torchaudio
  - pytorch-cuda=12.4

  # Numeric / image / tabular stack.
  - "numpy>=2,<3"
  - scipy
  - scikit-image
  - scikit-learn
  - opencv
  - pyarrow
  - polars
  - pandas
  - h5py
  - "zarr>=3,<4"
  - dask
  - distributed
  - matplotlib
  - pillow
  - imageio
  - imageio-ffmpeg
  # The local Decord wheel is linked against FFmpeg 4.x shared libraries
  # (`libavformat.so.58`). Do not let the solver silently choose FFmpeg 5+ here.
  - "ffmpeg=4.4.*"
  - pyyaml
  - rich
  - tqdm
  - click
  - pydantic
  - hsluv
  - networkx
  - bokeh
  - joblib

  # Pure-Python or pip-first tools. Do not pin torch/torchvision here.
  - pip:
      - ultralytics==8.3.169
      - marimo
      - pybaselines
      - textual
      - textual-plotext
      - plotext
      - onnx
      - onnxruntime
      - onnxsim
