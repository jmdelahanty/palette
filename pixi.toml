[workspace]
name = "palette-analytics-app"
version = "0.1.0"
description = "Read-only Marimo explorer for immutable Palette analytics exports."
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
app = { cmd = "bash scripts/run_group_analytics_app.sh", description = "Start the read-only Palette analytics Marimo application." }
recording-app = { cmd = "bash scripts/run_recording_explorer_app.sh", description = "Start the read-only Palette recording Marimo application." }
recording-workspace = { cmd = "bash scripts/run_recording_exploration_workspace.sh", description = "Start the sandboxed editable Palette recording workspace for Marimo Pair." }

[dependencies]
python = "3.11.*"
marimo = "==0.23.3"
numpy = ">=2,<2.3"
pandas = ">=2.3,<3"
plotly = ">=6.6,<7"
polars = "==1.40.0"

[feature.recording.dependencies]
matplotlib-base = ">=3.9,<4"
pyyaml = ">=6,<7"
rich = ">=13,<15"
scipy = ">=1.14,<2"
zarr = ">=3,<4"

[environments]
default = { solve-group = "default" }
recording = { features = ["recording"], solve-group = "default" }
