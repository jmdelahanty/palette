name: Palette Recording Explorer
description: Open one Palette analysis Zarr in the locked, read-only Marimo recording viewer.
requirements:
  - pixi>=0.40

runnables:
  - id: recording-app
    name: Recording Explorer
    type: service
    description: >-
      Open one Palette analysis Zarr through bounded, capability-routed views.
      The selected Zarr is opened read-only and no save actions are exposed.
    command: pixi run --manifest-path ../../../pixi.toml -e recording recording-app --
    working_dir: repo
    pre_run: 'export PATH="$HOME/.pixi/bin:$PATH"'
    auto_url: true
    service_url_suffix: "/?access_token=${FG_SERVICE_TOKEN}"
    parameters:
      - flag: --zarr-path
        name: Recording Analysis Zarr
        type: directory
        description: >-
          One Palette analysis Zarr directory. Direct FileGlancer launches show
          only this recording.
        required: true
        exists: true
    resources:
      cpus: 2
      memory: "16 GB"
      walltime: "08:00"
