schema_id: palette.analysis_workflow
schema_version: 1
workflow_id: core_behavior_v1
description: >-
  Stimulus-independent core behavior workflow. Core motion, eye, and tail
  exports preserve every source frame; activity/spatial views use fixed time
  bins. Explicit downstream profiles may derive lower-rate motion views.

temporal_policy:
  kinematics:
    resolution: framewise
  activity_spatial:
    bin_size_s: 5
  eye_traces:
    resolution: framewise
  tail_traces:
    resolution: framewise

run_selection:
  refined_keypoints: latest
  refined_subject_masks: latest
  tracks: latest
  track_kinematics: latest
  swim_bouts: latest
  bout_kinematics: latest
  eye_angles: latest
  subject_shape: latest
  tail_kinematics: latest

targets:
  - kinematics_samples
  - activity_spatial_summaries
  - bout_kinematics
  - eye_traces
  - tail_traces

nodes:
  - id: refined_keypoints
    kind: prerequisite
    stage_id: refined_keypoints
    runnable: false
    description: >-
      Curated keypoint authority required downstream. This resolves either an
      active refined keypoint bundle or a selector-eligible canonical
      passthrough run produced by clipped inference.

  - id: refined_subject_masks
    kind: prerequisite
    stage_id: refined_subject_masks
    runnable: false
    description: >-
      Active recording subject-mask bundle authority required by eyes and body
      shape, with legacy refined-run selection retained for compatibility.

  - id: tracks
    kind: analysis
    stage_id: tracks
    depends_on: [refined_keypoints]
    description: >-
      Lineage-matched subject identities, materialized from the exact keypoint
      source crop rowset for one-subject recordings when no track authority is
      already selected.

  - id: track_kinematics
    kind: analysis
    stage_id: track_kinematics
    depends_on: [refined_keypoints, tracks]
    execution_policy: whole_recording_temporal_state
    description: Preserve smoothing, hysteresis, and derivatives across clip boundaries.

  - id: swim_bouts
    kind: analysis
    stage_id: swim_bouts
    depends_on: [track_kinematics]
    execution_policy: whole_recording_temporal_state
    description: Detect bouts on the continuous trace so events may cross clip boundaries.

  - id: track_kinematics_visualization
    kind: visualization
    stage_id: track_kinematics_visualization
    depends_on: [track_kinematics, swim_bouts]
    output_run_from: track_kinematics
    execution_policy: embedded_interactive_contract
    description: >-
      Persist the bounded core-behavior PNG snapshot and interactive spec in
      the selected track-kinematics run for recording-explorer discovery.

  - id: bout_kinematics
    kind: analysis
    stage_id: bout_kinematics
    depends_on: [track_kinematics, swim_bouts, track_kinematics_visualization, eye_angles]
    execution_policy: node_local_compute_atomic_publish
    description: >-
      Compute sparse per-bout movement, heading, and eye-gaze metrics from
      read-only authoritative inputs into node-local sharded output, validate
      it, and publish completion-last through the shared atomic run publisher.

  - id: eye_angles
    kind: analysis
    stage_id: eye_angles
    depends_on: [subject_shape]
    execution_policy: exact_source_subset_node_local_compute_shard_publish
    description: >-
      Stage completed subject-shape eye geometry locally, derive the exact
      canonical base-keypoint authority from that sealed publication, compute
      framewise eye angles without downsampling, shard the completed output,
      and publish it atomically with source and algorithm provenance.

  - id: subject_shape
    kind: analysis
    stage_id: subject_shape
    depends_on: [refined_subject_masks]
    execution_policy: chunk_aligned_workers
    description: Compute framewise body geometry and sampled tail splines.

  - id: tail_kinematics
    kind: analysis
    stage_id: tail_kinematics
    depends_on: [subject_shape]
    execution_policy: node_local_staged_process_shards
    description: >-
      Palette-native framewise tail angles, deflections, and curvature. The
      dedicated materializer stages required source shards to node-local
      storage, assigns workers complete non-overlapping output shards, and
      validates completion-last atomic publication.

  - id: kinematics_samples
    kind: export
    depends_on: [track_kinematics]
    temporal_product: kinematics
    execution_policy: immutable_parquet_export
    description: Source-rate position, speed, heading, and validity rows.

  - id: activity_spatial_summaries
    kind: export
    depends_on: [track_kinematics, swim_bouts]
    temporal_product: activity_spatial
    execution_policy: immutable_parquet_export
    description: >-
      Fixed-bin track coverage, physical-position distribution, distance, and
      bout summaries. Arena occupancy remains a separate geometry-bound
      authority.

  - id: eye_traces
    kind: export
    depends_on: [eye_angles]
    temporal_product: eye_traces
    execution_policy: immutable_framewise_export
    description: Framewise eye-angle and convergence traces with validity.

  - id: tail_traces
    kind: export
    depends_on: [subject_shape, tail_kinematics, track_kinematics]
    temporal_product: tail_traces
    execution_policy: streaming_immutable_framewise_export
    description: Framewise subject-shape spline points and Palette-native angle channels with validity.
