name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    name: package, boundaries, and collection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gpu]"

      - name: Import installed package
        run: |
          python -c "import fisheye; print(fisheye.__version__)"

      - name: Smoke installed palette entrypoint
        run: |
          palette --help >/dev/null
          palette status --help >/dev/null

      - name: Lint import boundaries
        run: |
          lint-imports --config pyproject.toml

      - name: Check file-size ratchet
        run: |
          python scripts/check_file_size_ratchet.py
          git diff --exit-code -- scripts/file_size_ratchet_baseline.json

      - name: Collect tests
        run: |
          python -m pytest --collect-only -q tests/

  tests:
    name: non-gpu tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Restore persistent test fixtures
        uses: actions/cache@v4
        with:
          path: .pytest_cache/palette-fixtures
          key: palette-test-fixtures-v1-${{ runner.os }}-shard-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: |
            palette-test-fixtures-v1-${{ runner.os }}-shard-${{ matrix.shard }}-

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gpu]"

      - name: Run non-GPU test shard
        run: |
          python scripts/ci_pytest_shard.py \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 4 \
            -- -q -m "not gpu"
