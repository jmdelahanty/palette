name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    name: collection and non-gpu tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,gpu]"

      - name: Import installed package
        run: |
          python -c "import fisheye; print(fisheye.__version__)"

      - name: Smoke installed palette entrypoint
        run: |
          palette --help >/dev/null
          palette status --help >/dev/null

      - name: Collect tests
        run: |
          python -m pytest --collect-only -q tests/

      - name: Run non-GPU tests
        run: |
          python -m pytest -q -m "not gpu" tests/
